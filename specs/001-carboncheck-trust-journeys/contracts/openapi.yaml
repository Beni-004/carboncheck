openapi: 3.1.0
info:
  title: CarbonCheck API
  version: 0.1.0
  description: |
    Four-layer verification and public leaderboard API.
    Verification flow: Ground -> Satellite -> AI -> Scoring.
    Design constraints:
    - External API timeout per source: 3 seconds
    - Supabase cache fallback when upstream source fails
    - Never return HTTP 500
servers:
  - url: https://api.carboncheck.example

tags:
  - name: Verify
  - name: Leaderboard
  - name: Health

paths:
  /api/verify:
    post:
      tags: [Verify]
      summary: Verify one or many carbon credit IDs
      description: |
        Accepts 1-50 project IDs for verification.
        Returns deterministic check breakdown with four-layer evidence.
        Supports cache fallback when external sources timeout (3s limit).
      operationId: verifyCredits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
            examples:
              single:
                summary: Single project verification
                value:
                  project_ids: ["PROJ-001"]
              bulk:
                summary: Bulk verification (up to 50)
                value:
                  project_ids: ["PROJ-001", "PROJ-002", "PROJ-003"]
      responses:
        '200':
          description: Successful verification response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
              examples:
                success_live:
                  summary: Successful verification with live data
                  value:
                    results:
                      - project_id: "PROJ-001"
                        total_score: 45.5
                        verdict: "WARNING"
                        score_breakdown:
                          baseline_match: 12.5
                          additionality: 0.0
                          permanence_risk: 20.0
                          double_counting: 13.0
                        fallback_used: false
                        data_mode: "live"
                        source_provenance:
                          - layer: "ground"
                            source_name: "Registry"
                            fetched_at: "2024-03-24T10:30:00Z"
                            freshness_state: "live"
                            cache_age_seconds: null
                          - layer: "satellite"
                            source_name: "Earth-Engine"
                            fetched_at: "2024-03-24T10:30:01Z"
                            freshness_state: "live"
                            cache_age_seconds: null
                        layer_evidence:
                          ground_summary: "Registry metadata and claimed CO2 matched canonical record"
                          satellite_summary: "NDVI time-series retrieved from Earth Engine without fallback"
                          ai_summary: "Model estimate produced expected CO2 range with moderate uncertainty"
                          scoring_summary: "Fixed-weight checks produced WARNING verdict"
                        computed_at: "2024-03-24T10:30:02Z"
                        rank_in_batch: null
                    errors: []
                    total_requested: 1
                    total_succeeded: 1
                    total_failed: 0
                success_cached:
                  summary: Successful verification with cached fallback
                  value:
                    results:
                      - project_id: "PROJ-002"
                        total_score: 62.5
                        verdict: "WARNING"
                        score_breakdown:
                          baseline_match: 12.5
                          additionality: 25.0
                          permanence_risk: 15.0
                          double_counting: 10.0
                        fallback_used: true
                        data_mode: "cache"
                        source_provenance:
                          - layer: "ground"
                            source_name: "Supabase-Cache"
                            fetched_at: "2024-03-23T14:20:00Z"
                            freshness_state: "cache"
                            cache_age_seconds: 72600
                          - layer: "satellite"
                            source_name: "Supabase-Cache"
                            fetched_at: "2024-03-23T14:20:00Z"
                            freshness_state: "cache"
                            cache_age_seconds: 72600
                        layer_evidence:
                          ground_summary: "Ground layer served from cached registry snapshot"
                          satellite_summary: "Satellite layer served from cached NDVI snapshot"
                          ai_summary: "AI estimate reused deterministic cached features"
                          scoring_summary: "Final score computed with cache provenance flags"
                        computed_at: "2024-03-24T10:30:02Z"
                        rank_in_batch: null
                    errors: []
                    total_requested: 1
                    total_succeeded: 1
                    total_failed: 0
                partial_failure:
                  summary: Bulk verification with partial failures
                  value:
                    results:
                      - project_id: "PROJ-001"
                        total_score: 35.0
                        verdict: "FAIL"
                        score_breakdown:
                          baseline_match: 5.0
                          additionality: 0.0
                          permanence_risk: 15.0
                          double_counting: 15.0
                        fallback_used: false
                        data_mode: "live"
                        source_provenance:
                          - layer: "ground"
                            source_name: "Registry"
                            fetched_at: "2024-03-24T10:30:00Z"
                            freshness_state: "live"
                            cache_age_seconds: null
                        layer_evidence:
                          ground_summary: "Ground metadata available for project"
                          satellite_summary: "Satellite signal suggests weak vegetation trend"
                          ai_summary: "AI anomaly detector flagged pattern as unusual"
                          scoring_summary: "Combined checks produced FAIL"
                        computed_at: "2024-03-24T10:30:02Z"
                        rank_in_batch: 1
                    errors:
                      - project_id: "PROJ-999"
                        error_code: "PROJECT_NOT_FOUND"
                        error_message: "Project PROJ-999 not found in registry"
                    total_requested: 2
                    total_succeeded: 1
                    total_failed: 1
        '400':
          description: Invalid payload shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_input:
                  summary: Invalid request payload
                  value:
                    error_code: "VALIDATION_ERROR"
                    error_message: "Request validation failed"
                    details:
                      - loc: ["body", "project_ids"]
                        msg: "field required"
                        type: "value_error.missing"
                    timestamp: "2024-03-24T10:30:00Z"
        '422':
          description: Validation failed for one or more IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Degraded service with no scoreable data (still non-500)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                degraded:
                  summary: Service degraded (no external sources available)
                  value:
                    error_code: "SERVICE_DEGRADED"
                    error_message: "Service is temporarily degraded. Request was received but could not be fully processed. Cached data may be returned where available."
                    details:
                      exception_type: "ConnectionError"
                      path: "/api/verify"
                    timestamp: "2024-03-24T10:30:00Z"

  /api/leaderboard:
    get:
      tags: [Leaderboard]
      summary: Fetch public leaderboard of most-flagged credits
      operationId: getLeaderboard
      parameters:
        - name: project_type
          in: query
          required: false
          schema:
            type: string
            enum: [forestry, renewable, soil, other]
          description: Filter by project type category
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          description: Maximum number of results to return
      responses:
        '200':
          description: Leaderboard snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
              examples:
                all_categories:
                  summary: Leaderboard (all categories)
                  value:
                    entries:
                      - project_id: "PROJ-042"
                        project_type: "forestry"
                        total_score: 25.5
                        verdict: "FAIL"
                        registry_name: "CDM"
                        claimed_tco2: 50000.0
                        rank_overall: 1
                        rank_in_category: 1
                      - project_id: "PROJ-089"
                        project_type: "renewable"
                        total_score: 38.0
                        verdict: "FAIL"
                        registry_name: "Verra"
                        claimed_tco2: 25000.0
                        rank_overall: 2
                        rank_in_category: 1
                    refreshed_at: "2024-03-24T10:00:00Z"
                    total_entries: 150
                    filter_applied: null
                filtered:
                  summary: Leaderboard (forestry only)
                  value:
                    entries:
                      - project_id: "PROJ-042"
                        project_type: "forestry"
                        total_score: 25.5
                        verdict: "FAIL"
                        registry_name: "CDM"
                        claimed_tco2: 50000.0
                        rank_overall: 1
                        rank_in_category: 1
                    refreshed_at: "2024-03-24T10:00:00Z"
                    total_entries: 45
                    filter_applied: "forestry"
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cache unavailable/degraded (still non-500)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/health:
    get:
      tags: [Health]
      summary: Service and dependency health
      operationId: getHealth
      responses:
        '200':
          description: Healthy or degraded but serving
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: All dependencies healthy
                  value:
                    status: "healthy"
                    version: "1.0.0"
                    dependencies:
                      - name: "supabase"
                        status: "healthy"
                        latency_ms: 45
                        last_checked: "2024-03-24T10:30:00Z"
                        error_message: null
                      - name: "ember_api"
                        status: "healthy"
                        latency_ms: null
                        last_checked: "2024-03-24T10:30:00Z"
                        error_message: null
                      - name: "cea_api"
                        status: "healthy"
                        latency_ms: null
                        last_checked: "2024-03-24T10:30:00Z"
                        error_message: null
                    checked_at: "2024-03-24T10:30:00Z"
                degraded:
                  summary: Some dependencies unavailable
                  value:
                    status: "degraded"
                    version: "1.0.0"
                    dependencies:
                      - name: "supabase"
                        status: "healthy"
                        latency_ms: 50
                        last_checked: "2024-03-24T10:30:00Z"
                        error_message: null
                      - name: "ember_api"
                        status: "unavailable"
                        latency_ms: 3000
                        last_checked: "2024-03-24T10:30:00Z"
                        error_message: "Request timed out after 3s"
                      - name: "cea_api"
                        status: "healthy"
                        latency_ms: null
                        last_checked: "2024-03-24T10:30:00Z"
                        error_message: null
                    checked_at: "2024-03-24T10:30:00Z"
        '503':
          description: Critical dependency failure (service intentionally degraded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    VerifyRequest:
      type: object
      additionalProperties: false
      required: [project_ids]
      properties:
        project_ids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: List of project IDs to verify (1-50 items)

    ScoreBreakdown:
      type: object
      additionalProperties: false
      required: [baseline_match, additionality, permanence_risk, double_counting]
      properties:
        baseline_match:
          type: number
          minimum: 0
          maximum: 25
          description: Claimed tCO2 vs actual grid generation score (0-25)
        additionality:
          type: number
          minimum: 0
          maximum: 25
          description: Project additionality score (0-25, mandated=0)
        permanence_risk:
          type: number
          minimum: 0
          maximum: 25
          description: Permanence risk score (0-25, lower=riskier)
        double_counting:
          type: number
          minimum: 0
          maximum: 25
          description: Double counting risk score (0-25, multiple registries=0)

    SourceProvenance:
      type: object
      additionalProperties: false
      required: [layer, source_name, fetched_at, freshness_state, cache_age_seconds]
      properties:
        layer:
          type: string
          enum: [ground, satellite, ai, scoring]
          description: Verification layer emitting this provenance record
        source_name:
          type: string
          description: Name of external data source
          enum: [Registry, Project-Documents, Earth-Engine, Supabase-Cache, AI-Model, Scoring-Policy]
        fetched_at:
          type: string
          format: date-time
          description: Timestamp when data was fetched from source
        freshness_state:
          type: string
          enum: [live, cache, stale, mixed]
          description: Whether data is fresh from API or fallback cache
        cache_age_seconds:
          type: integer
          nullable: true
          description: Age of cached data in seconds (null if live)

    LayerEvidence:
      type: object
      additionalProperties: false
      required: [ground_summary, satellite_summary, ai_summary, scoring_summary]
      properties:
        ground_summary:
          type: string
          description: Ground Layer evidence summary
        satellite_summary:
          type: string
          description: Satellite Layer evidence summary
        ai_summary:
          type: string
          description: AI Layer evidence summary
        scoring_summary:
          type: string
          description: Scoring Layer rationale summary

    TrustScoreResult:
      type: object
      additionalProperties: false
      required:
        - project_id
        - total_score
        - verdict
        - score_breakdown
        - fallback_used
        - data_mode
        - source_provenance
        - layer_evidence
        - computed_at
        - rank_in_batch
      properties:
        project_id:
          type: string
          description: Project identifier
        total_score:
          type: number
          minimum: 0
          maximum: 100
          description: Total trust score (0-100)
        verdict:
          type: string
          enum: [FAIL, WARNING, PASS, UNVERIFIED]
          description: "Overall verdict: FAIL (<40), WARNING (40-69), PASS (>=70), UNVERIFIED (insufficient evidence)"
        score_breakdown:
          $ref: '#/components/schemas/ScoreBreakdown'
        fallback_used:
          type: boolean
          description: True if any source used cached data due to timeout/failure
        data_mode:
          type: string
          enum: [live, mixed, cache]
          description: "Data freshness: live (all live), mixed (live+cache blend), cache (all cache)"
        source_provenance:
          type: array
          items:
            $ref: '#/components/schemas/SourceProvenance'
          description: Provenance tracking for all external sources used
        layer_evidence:
          $ref: '#/components/schemas/LayerEvidence'
        computed_at:
          type: string
          format: date-time
          description: Timestamp when score was computed
        rank_in_batch:
          type: integer
          nullable: true
          minimum: 1
          description: Rank within bulk verification batch (null for single verify)

    VerifyErrorDetail:
      type: object
      additionalProperties: false
      required: [project_id, error_code, error_message]
      properties:
        project_id:
          type: string
          description: Project identifier that failed
        error_code:
          type: string
          description: Machine-readable error code
          enum: [PROJECT_NOT_FOUND, INVALID_PROJECT_ID, VERIFICATION_ERROR]
        error_message:
          type: string
          description: Human-readable error message

    VerifyResponse:
      type: object
      additionalProperties: false
      required:
        - results
        - errors
        - total_requested
        - total_succeeded
        - total_failed
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TrustScoreResult'
          description: Successfully computed trust scores
        errors:
          type: array
          items:
            $ref: '#/components/schemas/VerifyErrorDetail'
          description: Failed project verifications with error details
        total_requested:
          type: integer
          minimum: 1
          description: Total number of project IDs requested
        total_succeeded:
          type: integer
          minimum: 0
          description: Number of successful verifications
        total_failed:
          type: integer
          minimum: 0
          description: Number of failed verifications

    LeaderboardEntry:
      type: object
      additionalProperties: false
      required:
        - project_id
        - project_type
        - total_score
        - verdict
        - registry_name
        - claimed_tco2
        - rank_overall
        - rank_in_category
      properties:
        project_id:
          type: string
          description: Project identifier
        project_type:
          type: string
          enum: [forestry, renewable, soil, other]
          description: Project category
        total_score:
          type: number
          minimum: 0
          maximum: 100
          description: Total trust score (0-100)
        verdict:
          type: string
          enum: [FAIL, WARNING, PASS, UNVERIFIED]
          description: Overall verdict
        registry_name:
          type: string
          description: Registry name where project is listed
        claimed_tco2:
          type: number
          description: Claimed tCO2 reduction
        rank_overall:
          type: integer
          minimum: 1
          description: Overall rank (1 = worst score)
        rank_in_category:
          type: integer
          minimum: 1
          description: Rank within project category (1 = worst in category)

    LeaderboardResponse:
      type: object
      additionalProperties: false
      required:
        - entries
        - refreshed_at
        - total_entries
        - filter_applied
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
          description: Ranked leaderboard entries
        refreshed_at:
          type: string
          format: date-time
          description: Timestamp when leaderboard was last refreshed
        total_entries:
          type: integer
          minimum: 0
          description: Total number of entries in full leaderboard
        filter_applied:
          type: string
          nullable: true
          enum: [forestry, renewable, soil, other]
          description: Project type filter applied (if any)

    DependencyHealth:
      type: object
      additionalProperties: false
      required: [name, status, latency_ms, last_checked, error_message]
      properties:
        name:
          type: string
          description: Dependency name
          enum: [supabase, ember_api, cea_api, grid_india_api, rec_registry_api]
        status:
          type: string
          enum: [healthy, degraded, unavailable]
          description: Health status
        latency_ms:
          type: integer
          nullable: true
          description: Response latency in milliseconds (if available)
        last_checked:
          type: string
          format: date-time
          description: Timestamp of last health check
        error_message:
          type: string
          nullable: true
          description: Error message if status is degraded/unavailable

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version, dependencies, checked_at]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unavailable]
          description: Overall system health status
        version:
          type: string
          description: API version
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DependencyHealth'
          description: Health status of all dependencies
        checked_at:
          type: string
          format: date-time
          description: Timestamp of this health check

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error_code, error_message, timestamp]
      properties:
        error_code:
          type: string
          description: Machine-readable error code
        error_message:
          type: string
          description: Human-readable error message
        details:
          type: object
          nullable: true
          description: Additional error context (optional)
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
